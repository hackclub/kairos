name: macos-check
on:
  workflow_dispatch:
  # Dispatch only finds workflows on main; before that, pushing to a macos-check/* branch runs it.
  push:
    branches: ['macos-check/**']
jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: app bundle ids and executables
        timeout-minutes: 1
        run: |
          sw_vers
          for app in /Applications/*.app /System/Applications/*.app /System/Applications/Utilities/*.app; do
            plist="$app/Contents/Info.plist"
            [ -f "$plist" ] || continue
            id=$(plutil -extract CFBundleIdentifier raw -o - "$plist" 2>/dev/null)
            exe=$(plutil -extract CFBundleExecutable raw -o - "$plist" 2>/dev/null)
            echo "$id | $exe | $app"
          done
      - name: build
        timeout-minutes: 8
        run: cargo test -p kairos-agent --locked --no-run && cargo build -p kairos-agent --locked
      - name: unit tests
        timeout-minutes: 2
        run: cargo test -p kairos-agent --locked
      - name: backend against real apps
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: cargo test -p kairos-agent --locked -- --ignored --nocapture --test-threads=1
      - name: kairosd records focus and presence
        if: ${{ !cancelled() }}
        timeout-minutes: 2
        run: |
          set -eu
          export KAIROS_DIR="$RUNNER_TEMP/kairos"
          repo="$RUNNER_TEMP/e2e/kairos-e2e-proj"
          mkdir -p "$repo/.git"
          # The real-app test leaves a Terminal window open, and two windows with nobody typing show no project.
          if pgrep -x Terminal > /dev/null; then osascript -e 'tell application "Terminal" to quit' || pkill -x Terminal; sleep 2; fi
          target/debug/kairosd 2> "$RUNNER_TEMP/kairosd.err" &
          pid=$!
          sleep 3
          open -a TextEdit
          sleep 3
          open -a Terminal "$repo"
          sleep 20
          echo "kairosd rss/vsz (KiB, debug build):"
          ps -o rss=,vsz= -p "$pid"
          kill "$pid"
          cat "$RUNNER_TEMP/kairosd.err"
          cat "$KAIROS_DIR"/events-*.jsonl
          grep -q '"cgwindowlist"' "$KAIROS_DIR"/events-*.jsonl
          grep -q '"cgeventsource"' "$KAIROS_DIR"/events-*.jsonl
          grep '"terminal"' "$KAIROS_DIR"/events-*.jsonl | grep -q 'kairos-e2e-proj'
      - name: core and cli tests
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: cargo test -p kairos-core -p kairos-cli --locked
      - name: kairos login comes back through the default browser
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          set -eu
          cargo build -p kairos-cli --locked
          # Stands in for the server: the same hand-off page as /device/connect, and an exchange that checks PKCE.
          cat > "$RUNNER_TEMP/fake_kairos.py" <<'EOF'
          import base64, hashlib, html, json, sys, urllib.parse
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          grants = {}

          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  u = urllib.parse.urlsplit(self.path)
                  q = dict(urllib.parse.parse_qsl(u.query))
                  if u.path == "/device/connect":
                      grants["kg_mac"] = q["challenge"]
                      to = html.escape(f"http://127.0.0.1:{int(q['port'])}/callback?code=kg_mac&state={urllib.parse.quote(q['state'])}")
                      self.reply(200, "text/html", f'<!doctype html><meta http-equiv="refresh" content="0;url={to}"><a href="{to}">Continue</a>')
                  else:
                      self.reply(200, "text/html", "<!doctype html><p>dashboard</p>")

              def do_POST(self):
                  r = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  challenge = grants.pop(r.get("code"), None)
                  proof = base64.urlsafe_b64encode(hashlib.sha256(r.get("verifier", "").encode()).digest()).rstrip(b"=").decode()
                  if self.path == "/api/v1/device/exchange" and challenge == proof:
                      self.reply(200, "application/json", json.dumps({"token": "kd_mac", "username": "ada"}))
                  else:
                      self.reply(400, "application/json", '{"error":"bad exchange"}')

              def reply(self, status, ctype, body):
                  b = body.encode()
                  self.send_response(status)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)

              def log_message(self, fmt, *args):
                  sys.stderr.write("%s | %s\n" % (fmt % args, self.headers.get("User-Agent")))

          ThreadingHTTPServer(("127.0.0.1", int(sys.argv[1])), H).serve_forever()
          EOF
          python3 "$RUNNER_TEMP/fake_kairos.py" 8765 2> "$RUNNER_TEMP/fake.log" &
          # Safari is already open from the steps above and asks for the page at once, so the fake has to be up first.
          for _ in $(seq 50); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.2; done
          export KAIROS_DIR="$RUNNER_TEMP/kairos-login"
          target/debug/kairos login --server http://127.0.0.1:8765 > "$RUNNER_TEMP/login.out" 2>&1 &
          login=$!
          for _ in $(seq 60); do kill -0 "$login" 2>/dev/null || break; sleep 2; done
          cat "$RUNNER_TEMP/login.out" "$RUNNER_TEMP/fake.log"
          if kill -0 "$login" 2>/dev/null; then
            echo "no answer from the browser after 2 minutes"
            pgrep -fl Safari || echo "Safari isn't running"
            plutil -p ~/Library/Preferences/com.apple.LaunchServices/com.apple.launchservices.secure.plist 2>/dev/null | grep -B1 -A3 -i '"http' || true
            port=$(sed -n 's/.*port=\([0-9]*\).*/\1/p' "$RUNNER_TEMP/login.out" | head -1)
            curl -sS -m 5 -o /dev/null -w "fake kairos answers %{http_code}\n" http://127.0.0.1:8765/ || true
            curl -sS -m 5 -o /dev/null -w "kairos login answers %{http_code}\n" "http://127.0.0.1:$port/callback" || true
            screencapture -x "$RUNNER_TEMP/screen.png" || true
            kill "$login"
            exit 1
          fi
          wait "$login"
          grep -q "Signed in as ada on http://127.0.0.1:8765" "$RUNNER_TEMP/login.out"
          grep -q kd_mac "$KAIROS_DIR/account.json"
          grep "/me?connected=1" "$RUNNER_TEMP/fake.log" | grep -q Safari
      - name: screen when the browser check failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-screen
          path: ${{ runner.temp }}/screen.png
          if-no-files-found: ignore
