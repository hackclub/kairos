name: lab
on:
  push:
    branches: [lab]
  # Main starts this every night, since schedules only run from the default branch.
  workflow_call:
    secrets:
      LAB_SLACK_WEBHOOK:
        required: false
permissions:
  contents: read
  actions: read
env:
  # Empty means the version kairos.hackclub.com serves, the one people run.
  KAIROS: ""
  # A ci run on main, to try its kairosd before it becomes a release.
  CANDIDATE: ""
  GITHUB_TOKEN: ${{ github.token }}
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: windows-latest, target: windows-x86_64 }
          - { os: macos-latest, target: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: the kairosd to test
        shell: bash
        run: |
          if [ -n "$CANDIDATE" ]; then
            echo "kairosd from ci run $CANDIDATE"
            GH_TOKEN=$GITHUB_TOKEN gh run download "$CANDIDATE" -R "$GITHUB_REPOSITORY" -n "kairos-${{ matrix.target }}" -D "dist/${{ matrix.target }}"
            chmod +x dist/${{ matrix.target }}/kairosd*
            exit 0
          fi
          if [ -z "$KAIROS" ]; then
            KAIROS=$(curl -fsSL https://kairos.hackclub.com/download/latest/manifest.json | tr -d '\r\n' | sed 's/.*"version": *"\([^"]*\)".*/\1/')
          fi
          echo "kairosd $KAIROS"
          curl -fsSL -o dist.tgz "https://github.com/hackclub/kairos/releases/download/v$KAIROS/kairos-dist-$KAIROS.tar.gz"
          mkdir dist
          tar -xzf dist.tgz -C dist
      # Each run happens in a terminal window in front, where Kairos has to find the agent.
      - name: every version (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # Sourced: a script started from Git Bash gets a parent Windows no longer knows, and Kairos walks the console's
        # processes from parent to child.
        run: . ci/all.sh ${{ matrix.target }} --real-home --window
      - name: every version (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb openbox xterm x11-utils xdotool
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 > /dev/null 2>&1 &
          for i in $(seq 50); do xdpyinfo > /dev/null 2>&1 && break; sleep 0.2; done
          openbox > /dev/null 2>&1 &
          for i in $(seq 50); do xprop -root _NET_SUPPORTING_WM_CHECK | grep -q "window id" && break; sleep 0.2; done
          xterm -e ci/all.sh ${{ matrix.target }} --window
          cat result.txt
          exit "$(cat failed.txt)"
      - name: every version (macOS)
        if: runner.os == 'macOS'
        run: |
          printf '#!/bin/bash\nexport PATH=%q CI=true GITHUB_TOKEN=%q\ncd %q\nci/all.sh %s --window\n' "$PATH" "$GITHUB_TOKEN" "$PWD" "${{ matrix.target }}" > "$RUNNER_TEMP/run.command"
          chmod +x "$RUNNER_TEMP/run.command"
          open -a Terminal "$RUNNER_TEMP/run.command"
          for i in $(seq 1500); do [ -f failed.txt ] && break; sleep 2; done
          cat result.txt
          exit "$(cat failed.txt)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.target }}
          path: result.txt
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.target }}
          path: |
            work
            !work/*/home
          include-hidden-files: true
          retention-days: 7
  tell:
    needs: run
    # Not on a push to lab, where a red run is someone working on the lab.
    if: failure() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
      - name: post to Slack
        env:
          HOOK: ${{ secrets.LAB_SLACK_WEBHOOK }}
        run: |
          [ -n "$HOOK" ] || { echo "no LAB_SLACK_WEBHOOK secret"; exit 1; }
          # The failed runs and what was wrong, without the screens.
          wrong=$(for f in results/*/result.txt; do
            t=${f#results/result-}
            awk '/^FAIL/ { f = 1; print; next } /^lab: .*(quit|never|failed|could not)/ { f = 0; sub(/ Screen:$/, ""); print; next } /^  / && f { print; next } { f = 0 }' "$f" | cut -c 1-300 | sed "s|^|${t%/result.txt}  |"
          done | head -40)
          jq -n --arg t "Harness lab is red: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"$'\n```\n'"$wrong"$'\n```' '{text: $t}' | curl -fsS -X POST -H 'Content-type: application/json' --data @- "$HOOK"
