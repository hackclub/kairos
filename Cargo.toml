[package]
name = "kairos-lab"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "lab"
path = "src/main.rs"

[workspace]

[dependencies]
anyhow = "1"
# The credit rule the server runs, from main.
kairos-core = { git = "https://github.com/hackclub/kairos", branch = "main" }
tungstenite = "0.24"
portable-pty = "0.9"
serde_json = "1"
tiny_http = "0.12"
vt100 = "0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
